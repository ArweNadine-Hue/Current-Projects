<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Lumine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#FAF6F0] min-h-screen">

    <nav class="bg-white border-b border-[#F5EDE4] sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-[#F4C95F] to-[#FF9EBE] rounded-2xl flex items-center justify-center text-white text-2xl shadow-sm">🧋</div>
                <span class="text-3xl font-black tracking-tighter text-[#2C3E6B]">Lumine</span>
            </div>
            
            <!-- Desktop Navigation -->
            <div class="hidden md:flex items-center gap-8 text-sm font-bold text-gray-500">
                <!-- Discovery Links -->
                <a href="index.html" class="hover:text-[#F4C95F]">Menu</a>
                <a href="faqs.html" class="hover:text-[#F4C95F] transition-colors">FAQ</a>
                
                <!-- User & Account Links -->
                <a href="favorites.html" class="hover:text-[#F4C95F] transition-colors">Favorites</a>
                <a href="orders.html" class="hover:text-[#F4C95F] transition-colors">History</a>
                
                <!-- Profile -->
                <a href="profile.html" class="text-[#F4C95F] transition-colors flex items-center gap-2 border-l pl-8">
                    <i class="fa-solid fa-user-circle"></i> <span id="display-name">Profile</span>
                </a>
            </div>

            <!-- Mobile Menu Button & Cart -->
            <div class="flex items-center gap-4">
                <button onclick="toggleMobileMenu(true)" class="md:hidden text-xl text-gray-700 p-2"><i class="fa-solid fa-bars"></i></button>
                <a href="cart.html" class="relative w-10 h-10 bg-[#F5EDE4] rounded-xl flex items-center justify-center text-gray-600 hover:bg-[#F4C95F] hover:text-white transition-all">
                    <i class="fa-solid fa-cart-shopping text-sm"></i>
                    <span id="cart-count" class="absolute -top-1.5 -right-1.5 bg-[#F4C95F] text-white font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shadow-sm">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div id="mobile-drawer" class="fixed inset-0 z-[100] bg-black/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="drawer-panel" class="fixed top-0 left-0 bottom-0 w-64 bg-white p-6 transform -translate-x-full transition-transform duration-300 flex flex-col justify-between shadow-xl">
            <div class="space-y-6">
                <div class="flex justify-between items-center border-b pb-3">
                    <span class="font-black text-[#F4C95F] tracking-tight">Lumine</span>
                    <button onclick="toggleMobileMenu(false)" class="text-xl text-gray-400">&times;</button>
                </div>
                <div class="flex flex-col gap-4 font-bold text-sm text-gray-600">
                    <a href="index.html">🧋 Shop Catalog</a>
                    <a href="favorites.html">❤️ Favorites List</a>
                    <a href="orders.html">📜 Prior Invoices</a>
                    <a href="profile.html" class="text-[#F4C95F]">👤 User Profile</a>
                </div>
            </div>
        </div>
    </div>

    <main class="flex flex-col items-center justify-center p-6 mt-10">
        <div class="max-w-lg w-full bg-white p-8 rounded-[2rem] shadow-sm border border-[#F5EDE4] text-center">
            <!-- Profile Header -->
            <div class="relative w-28 h-28 bg-[#F5EDE4] rounded-full flex items-center justify-center text-4xl mx-auto mb-6 border-4 border-[#FAF6F0]">
                <i class="fa-solid fa-user text-[#F4C95F]"></i>
            </div>
            
            <h2 id="user-display-name" class="text-3xl font-black text-[#2C3E6B]">Loading...</h2>
            <p id="user-display-email" class="text-[#F4C95F] font-medium mb-8">Loading...</p>

            <!-- Stats Section -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-[#FAF6F0] p-4 rounded-2xl">
                    <p class="text-[10px] uppercase font-black text-gray-400 tracking-wider">Total Orders</p>
                    <p class="text-xl font-black text-[#2C3E6B]" id="user-order-count">0</p>
                </div>
                <div class="bg-[#FAF6F0] p-4 rounded-2xl">
                    <p class="text-[10px] uppercase font-black text-gray-400 tracking-wider">Member Since</p>
                    <p class="text-xl font-black text-[#2C3E6B]">2026</p>
                </div>
            </div>
            
            <!-- Actions -->
            <button onclick="logout()" 
                    class="w-full bg-[#2C3E6B] text-white font-bold py-4 rounded-2xl hover:bg-[#1a2a4d] mb-4 transition-all shadow-md">
                Logout
            </button>
            <a href="index.html" class="text-gray-400 hover:text-[#F4C95F] font-bold text-sm transition-colors">← Back to Menu</a>
        </div>
    </main>

    
    <script>
        // 1. Get user info
        const user = JSON.parse(localStorage.getItem('lumine_user'));
        if (user) {
            document.getElementById('user-display-name').innerText = user.name;
            document.getElementById('user-display-email').innerText = user.email;
        }

        // 2. Get order history directly from the source
        const orderHistory = JSON.parse(localStorage.getItem('lumine_order_history')) || [];
        
        // 3. Update the display
        document.getElementById('user-order-count').innerText = orderHistory.length;
    </script>

<script src="config.js"></script>
<script src="utilities.js"></script>
<script src="products.js"></script>
<script src="favorites.js"></script>
<script src="cart.js"></script>
<script src="checkout.js"></script>
<script src="orders.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>

</body>
</html>
