<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - Lumine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#FAF6F0] text-gray-800 min-h-screen flex flex-col justify-between">

    <nav class="bg-white border-b border-[#F5EDE4] sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-[#F4C95F] to-[#FF9EBE] rounded-2xl flex items-center justify-center text-white text-2xl shadow-sm">🧋</div>
                <span class="text-3xl font-black tracking-tighter text-[#2C3E6B]">Lumine</span>
            </div>
            
            <!-- Desktop Navigation -->
            <div class="hidden md:flex items-center gap-8 text-sm font-bold text-gray-500">
                <!-- Discovery Links -->
                <a href="index.html" class="hover:text-[#F4C95F]">Menu</a>
                <a href="faqs.html" class="hover:text-[#F4C95F] transition-colors">FAQ</a>
                
                <!-- User & Account Links -->
                <a href="favorites.html" class="hover:text-[#F4C95F] transition-colors">Favorites</a>
                <a href="orders.html" class="hover:text-[#F4C95F] transition-colors">History</a>
                
                <!-- Profile -->
                <a href="profile.html" class="hover:text-[#F4C95F] transition-colors flex items-center gap-2 border-l pl-8">
                    <i class="fa-solid fa-user-circle"></i> <span id="display-name">Profile</span>
                </a>
            </div>

            <!-- Mobile Menu Button & Cart -->
            <div class="flex items-center gap-4">
                <button onclick="toggleMobileMenu(true)" class="md:hidden text-xl text-gray-700 p-2"><i class="fa-solid fa-bars"></i></button>
                <a href="cart.html" class="relative w-10 h-10 bg-[#F5EDE4] rounded-xl flex items-center justify-center text-gray-600 hover:bg-[#F4C95F] hover:text-white transition-all">
                    <i class="fa-solid fa-cart-shopping text-sm"></i>
                    <span id="cart-count" class="absolute -top-1.5 -right-1.5 bg-[#F4C95F] text-white font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shadow-sm">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12 w-full flex-1">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
            
            <div class="md:col-span-6 space-y-6">
                <div class="bg-white p-6 rounded-3xl border border-[#F5EDE4] shadow-sm hover:border-[#F4C95F] transition-colors">
                    <h3 class="font-bold text-lg text-[#2C3E6B] mb-4">Summary Ledger</h3>
                    <div id="order-items" class="space-y-4 mb-4"></div>
                    <div class="border-t border-[#F5EDE4] pt-4 space-y-2 text-xs font-bold text-gray-500">
                        <div class="flex justify-between"><span>Subtotal</span><span id="summary-subtotal" class="text-[#2C3E6B]">₱0</span></div>
                        
                        <div id="summary-discount-row" class="flex justify-between hidden">
                            <span>Discount (<span id="summary-discount-rate">0%</span>)</span>
                            <span id="summary-discount-amount" class="text-[#F4C95F]">₱0</span>
                        </div>

                        <div class="flex justify-between">
                            <span>Voucher</span>
                            <select id="voucher-select" onchange="applyVoucher()" class="bg-[#F5EDE4] border border-[#F5EDE4] rounded p-1 text-sm">
                                <option value="0">No Voucher</option>
                                <option value="0.10">10% OFF</option>
                                <option value="0.20">20% OFF</option>
                                <option value="0.50">Exclusive Member Perk (50% OFF)</option>
                            </select>
                        </div>
                        <div class="flex justify-between text-lg font-black text-[#2C3E6B] border-t border-[#F5EDE4] pt-2 mt-2">
                            <span>Total</span><span id="summary-total" class="text-[#F4C95F]">₱0</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-3xl border border-[#F5EDE4] shadow-sm">
                    <h3 class="font-bold text-lg text-[#2C3E6B] mb-4">Select Payment Method</h3>
                    <div class="space-y-4">
                        <div class="p-4 border border-[#F5EDE4] rounded-xl hover:border-[#F4C95F] transition-colors">
                            <label class="flex items-center font-bold text-sm cursor-pointer">
                                <input type="radio" name="payment" value="gcash" class="mr-2 accent-[#F4C95F]" onchange="togglePaymentFields()"> GCash
                            </label>
                            <input type="text" id="gcash-name" placeholder="Account Name" class="payment-input-gcash w-full mt-2 p-3 border border-[#F5EDE4] rounded-xl text-sm outline-none" disabled>
                            <input type="text" id="gcash-number" placeholder="GCash Number" class="payment-input-gcash w-full mt-2 p-3 border border-[#F5EDE4] rounded-xl text-sm outline-none" disabled>
                        </div>
                        
                        <label class="block p-4 border border-[#F5EDE4] rounded-xl font-bold text-sm cursor-pointer hover:border-[#F4C95F] transition-colors">
                            <input type="radio" name="payment" value="cod" class="mr-2 accent-[#F4C95F]" onchange="togglePaymentFields()"> Cash on Delivery
                        </label>
                        
                        <div class="p-4 border border-[#F5EDE4] rounded-xl hover:border-[#F4C95F] transition-colors">
                            <label class="flex items-center font-bold text-sm cursor-pointer">
                                <input type="radio" name="payment" value="card" class="mr-2 accent-[#F4C95F]" onchange="togglePaymentFields()"> Credit/Debit Card
                            </label>
                            <input type="text" id="card-name" placeholder="Cardholder Name" class="payment-input-card w-full mt-2 p-3 border border-[#F5EDE4] rounded-xl text-sm outline-none" disabled>
                            <div class="flex gap-2 mt-2">
                                <input type="text" id="card-date" placeholder="MM/YY" class="payment-input-card w-1/2 p-3 border border-[#F5EDE4] rounded-xl text-sm outline-none" disabled>
                                <input type="text" id="card-cvc" placeholder="CVC/CVV" class="payment-input-card w-1/2 p-3 border border-[#F5EDE4] rounded-xl text-sm outline-none" disabled>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="md:col-span-6 space-y-6">
                <h2 class="text-2xl font-black text-[#2C3E6B] mb-2">Shipping Credentials</h2>
                
                <div class="grid grid-cols-1 gap-4 bg-white p-6 border border-[#F5EDE4] rounded-3xl hover:border-[#F4C95F] transition-colors">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Recipient Name</label>
                        <input type="text" id="shipping-name" placeholder="Enter your name" class="w-full px-4 py-3 border border-[#F5EDE4] rounded-2xl font-medium text-sm focus:border-[#F4C95F]">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Mobile Number</label>
                        <input type="text" placeholder="Enter your mobile number" class="w-full px-4 py-3 border border-[#F5EDE4] rounded-2xl font-medium text-sm focus:border-[#F4C95F]">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="col-span-2">
                            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Barangay</label>
                            <input type="text" id="address-brgy" placeholder="e.g. San Antonio" class="w-full px-4 py-3 border border-[#F5EDE4] rounded-2xl font-medium text-sm focus:border-[#F4C95F]">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">City</label>
                            <input type="text" id="address-city" placeholder="e.g. Santo Tomas" class="w-full px-4 py-3 border border-[#F5EDE4] rounded-2xl font-medium text-sm focus:border-[#F4C95F]">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Province</label>
                            <input type="text" id="address-province" placeholder="e.g. Batangas" class="w-full px-4 py-3 border border-[#F5EDE4] rounded-2xl font-medium text-sm focus:border-[#F4C95F]">
                        </div>
                    </div>
                </div>
                
                <button
                    id="place-order-btn"
                    onclick="completePayment()"
                    disabled
                    class="w-full bg-gradient-to-r from-[#F4C95F] to-[#FF9EBE] text-white font-bold py-4 rounded-3xl hover:brightness-110 transition-all shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
                    Place Order Now
                </button>
            </div>
        </div>
    </main>

    

<script src="config.js"></script>
<script src="utilities.js"></script>
<script src="products.js"></script>
<script src="favorites.js"></script>
<script src="cart.js"></script>
<script src="checkout.js"></script>
<script src="orders.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>

</body>
</html>
