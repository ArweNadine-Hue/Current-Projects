<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - Lumine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#FAF6F0] text-gray-800 min-h-screen flex flex-col justify-between">

    <nav class="bg-white border-b border-[#F5EDE4] sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-[#F4C95F] to-[#FF9EBE] rounded-2xl flex items-center justify-center text-white text-2xl shadow-sm">🧋</div>
                <span class="text-3xl font-black tracking-tighter text-[#2C3E6B]">Lumine</span>
            </div>
            
            <!-- Desktop Navigation -->
            <div class="hidden md:flex items-center gap-8 text-sm font-bold text-gray-500">
                <!-- Discovery Links -->
                <a href="index.html" class="hover:text-[#F4C95F]">Menu</a>
                <a href="faqs.html" class="hover:text-[#F4C95F] transition-colors">FAQ</a>
                
                <!-- User & Account Links -->
                <a href="favorites.html" class="hover:text-[#F4C95F] transition-colors">Favorites</a>
                <a href="orders.html" class="hover:text-[#F4C95F] transition-colors">History</a>
                
                <!-- Profile -->
                <a href="profile.html" class="text-[#F4C95F] transition-colors flex items-center gap-2 border-l pl-8">
                    <i class="fa-solid fa-user-circle"></i> <span id="display-name">Profile</span>
                </a>
            </div>

            <!-- Mobile Menu Button & Cart -->
            <div class="flex items-center gap-4">
                <button onclick="toggleMobileMenu(true)" class="md:hidden text-xl text-gray-700 p-2"><i class="fa-solid fa-bars"></i></button>
                <a href="cart.html" class="relative w-10 h-10 bg-[#F5EDE4] rounded-xl flex items-center justify-center text-gray-600 hover:bg-[#F4C95F] hover:text-white transition-all">
                    <i class="fa-solid fa-cart-shopping text-sm"></i>
                    <span id="cart-count" class="absolute -top-1.5 -right-1.5 bg-[#F4C95F] text-white font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shadow-sm">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12 w-full flex-1">
        <h1 class="text-3xl font-black text-[#2C3E6B] mb-6 flex items-center gap-2">
            <i class="fa-solid fa-basket-shopping text-[#F4C95F]"></i> 
            Shopping Cart
        </h1>
        
        <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
            <div class="md:col-span-7 space-y-4" id="cart-items"></div>
            
            <div class="md:col-span-5 bg-white p-6 rounded-3xl border border-[#F5EDE4] shadow-sm space-y-4">
                <h3 class="font-bold text-lg text-[#2C3E6B]">Checkout Breakdown</h3>
                <div class="border-b border-[#F5EDE4] pb-3 font-medium text-xs text-gray-500 space-y-2">
                    <div class="flex justify-between"><span>Subtotal</span><span id="cart-subtotal" class="text-[#2C3E6B] font-bold">₱0</span></div>
                    <div class="flex justify-between"><span>Delivery Cost</span><span class="text-emerald-600 font-bold">FREE</span></div>
                </div>
                <div class="flex justify-between items-center border-b pb-4">
                    <span class="font-bold text-sm text-[#2C3E6B]">Estimated Total</span>
                    <span id="cart-total" class="text-2xl font-black text-[#F4C95F]">₱0</span>
                </div>
                <button onclick="checkCartBeforeCheckout()" 
                        class="w-full bg-gradient-to-r from-[#F4C95F] to-[#FF9EBE] text-white font-bold text-sm py-4 rounded-xl shadow-sm hover:brightness-110 transition-all text-center block">
                    Advance to Shipping
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-[#F5EDE4] py-6 text-center text-xs font-semibold text-gray-400">
        © 2026 Lumine Milk Tea
    </footer>

    

<script src="config.js"></script>
<script src="utilities.js"></script>
<script src="products.js"></script>
<script src="favorites.js"></script>
<script src="cart.js"></script>
<script src="checkout.js"></script>
<script src="orders.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>

</body>
</html>
